<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 小小画家 - 全屏手势绘画</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Zcool+KuaiLe&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        
        #fullscreenCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            cursor: none;
            background: white;
        }
        
        #gestureCanvas {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 320px;
            height: 240px;
            z-index: 1000;
            border-radius: 20px;
            border: 4px solid #ff6b6b;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            opacity: 0.9;
        }
        
        .control-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            transition: opacity 0.3s;
        }
        
        .control-panel.hidden {
            opacity: 0;
        }
        
        .mode-btn {
            transition: all 0.3s;
        }
        
        .mode-btn.active {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255,107,107,0.8);
        }
        
        .gesture-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 999;
            pointer-events: none;
        }
        
        .gesture-indicator.show {
            opacity: 1;
            animation: pulse 0.5s ease;
        }
        
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.5); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        
        .sticker-btn {
            transition: all 0.2s;
        }
        
        .sticker-btn:hover {
            transform: scale(1.3);
        }
        
        #videoElement {
            display: none;
        }
        
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        
        .kid-font {
            font-family: 'Zcool KuaiLe', cursive;
        }
    </style>
</head>
<body class="bg-gray-900">
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="text-center text-white">
            <div class="text-6xl mb-4 animate-bounce">📷</div>
            <h2 class="text-2xl font-bold kid-font">正在启动摄像头...</h2>
            <p class="mt-2">请允许浏览器访问摄像头</p>
        </div>
    </div>
    
    <!-- Error Message -->
    <div id="errorMessage" class="fixed inset-0 bg-black/90 flex items-center justify-center z-index: 2000 hidden">
        <div class="bg-white rounded-3xl p-8 max-w-md text-center">
            <div class="text-6xl mb-4">😢</div>
            <h2 class="text-2xl font-bold text-gray-800 mb-4">摄像头启动失败</h2>
            <p id="errorText" class="text-gray-600 mb-6"></p>
            <button onclick="retryCamera()" class="bg-blue-500 text-white px-8 py-3 rounded-full font-bold hover:bg-blue-600">
                🔄 重试
            </button>
            <button onclick="useMouseMode()" class="bg-gray-500 text-white px-8 py-3 rounded-full font-bold hover:bg-gray-600 ml-4">
                🖱️ 使用鼠标模式
            </button>
        </div>
    </div>
    
    <!-- Main Canvas (Full Screen) -->
    <canvas id="fullscreenCanvas"></canvas>
    
    <!-- Control Panel -->
    <div id="controlPanel" class="control-panel">
        <div class="bg-white/90 backdrop-blur rounded-3xl p-6 shadow-xl">
            <h1 class="text-3xl font-black kid-font mb-4 text-center">🎨 小小画家</h1>
            
            <!-- Mode Selection -->
            <div class="flex gap-2 mb-4 justify-center">
                <button onclick="setMode('mouse')" id="mouseModeBtn" class="mode-btn bg-blue-500 text-white px-4 py-2 rounded-full font-bold active">
                    🖱️ 鼠标模式
                </button>
                <button onclick="setMode('gesture')" id="gestureModeBtn" class="mode-btn bg-purple-500 text-white px-4 py-2 rounded-full font-bold">
                    ✋ 手势模式
                </button>
            </div>
            
            <!-- Color Selection -->
            <div class="flex flex-wrap gap-2 justify-center mb-4">
                <div class="color-btn w-10 h-10 rounded-full cursor-pointer ring-4 ring-yellow-400" style="background: #ff6b6b;" data-color="#ff6b6b"></div>
                <div class="color-btn w-10 h-10 rounded-full cursor-pointer" style="background: #ffa502;" data-color="#ffa502"></div>
                <div class="color-btn w-10 h-10 rounded-full cursor-pointer" style="background: #ffd93d;" data-color="#ffd93d"></div>
                <div class="color-btn w-10 h-10 rounded-full cursor-pointer" style="background: #6bcb77;" data-color="#6bcb77"></div>
                <div class="color-btn w-10 h-10 rounded-full cursor-pointer" style="background: #4d96ff;" data-color="#4d96ff"></div>
                <div class="color-btn w-10 h-10 rounded-full cursor-pointer" style="background: #9b59b6;" data-color="#9b59b6"></div>
                <div class="color-btn w-10 h-10 rounded-full cursor-pointer" style="background: #ffffff;" data-color="#ffffff" title="橡皮"></div>
                <div class="color-btn w-10 h-10 rounded-full cursor-pointer" style="background: #2d3436;" data-color="#2d3436"></div>
            </div>
            
            <!-- Brush Size -->
            <div class="mb-4">
                <label class="text-sm font-bold text-gray-600">画笔大小：<span id="brushSizeLabel">20</span></label>
                <input type="range" id="brushSize" min="5" max="100" value="20" class="w-full accent-pink-500">
            </div>
            
            <!-- Actions -->
            <div class="flex gap-2 justify-center flex-wrap">
                <button onclick="clearCanvas()" class="bg-red-500 text-white px-4 py-2 rounded-full font-bold hover:bg-red-600">
                    🗑️ 清空
                </button>
                <button onclick="saveCanvas()" class="bg-green-500 text-white px-4 py-2 rounded-full font-bold hover:bg-green-600">
                    💾 保存
                </button>
                <button onclick="undo()" class="bg-yellow-500 text-white px-4 py-2 rounded-full font-bold hover:bg-yellow-600">
                    ↩️ 撤销
                </button>
                <button onclick="togglePanel()" class="bg-gray-500 text-white px-4 py-2 rounded-full font-bold hover:bg-gray-600">
                    📝 面板
                </button>
            </div>
            
            <!-- Gesture Help -->
            <div id="gestureHelp" class="mt-4 p-4 bg-purple-100 rounded-xl hidden">
                <h3 class="font-bold text-purple-600 mb-2">✋ 手势说明：</h3>
                <div class="text-sm space-y-1">
                    <p>✌️ 食指+中指 = 绘画</p>
                    <p>✊ 握拳 = 停止绘画</p>
                    <p>👍 大拇指向上 = 切换颜色</p>
                    <p>✋ 五指张开 = 清空画布</p>
                    <p>🤟 OK手势 = 添加贴纸</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Video Preview (Gesture Detection) -->
    <video id="videoElement" autoplay playsinline muted></video>
    <canvas id="gestureCanvas"></canvas>
    
    <!-- Gesture Indicator -->
    <div id="gestureIndicator" class="gesture-indicator"></div>
    
    <!-- Sticker Bar -->
    <div id="stickerBar" class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur p-4 z-1002 hidden">
        <div class="flex justify-center gap-4 flex-wrap">
            <button onclick="setStamp('⭐')" class="sticker-btn text-5xl hover:scale-150 transition">⭐</button>
            <button onclick="setStamp('❤️')" class="sticker-btn text-5xl hover:scale-150 transition">❤️</button>
            <button onclick="setStamp('🌈')" class="sticker-btn text-5xl hover:scale-150 transition">🌈</button>
            <button onclick="setStamp('🦄')" class="sticker-btn text-5xl hover:scale-150 transition">🦄</button>
            <button onclick="setStamp('🌸')" class="sticker-btn text-5xl hover:scale-150 transition">🌸</button>
            <button onclick="setStamp('🎀')" class="sticker-btn text-5xl hover:scale-150 transition">🎀</button>
            <button onclick="setStamp('🌟')" class="sticker-btn text-5xl hover:scale-150 transition">🌟</button>
            <button onclick="setStamp('🦋')" class="sticker-btn text-5xl hover:scale-150 transition">🦋</button>
            <button onclick="closeStickerBar()" class="text-3xl bg-red-500 text-white rounded-full w-12 h-12">✕</button>
        </div>
    </div>
    
    <!-- Mode Indicator -->
    <div id="modeIndicator" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-white/90 backdrop-blur px-6 py-2 rounded-full font-bold text-lg z-1003 hidden">
        ✋ 手势模式已开启
    </div>
    
    <script>
        // Canvas Setup
        const canvas = document.getElementById('fullscreenCanvas');
        const ctx = canvas.getContext('2d');
        const gestureCanvas = document.getElementById('gestureCanvas');
        const gestureCtx = gestureCanvas.getContext('2d');
        
        // Set canvas to fullscreen
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Fill white background
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Drawing state
        let isDrawing = false;
        let currentMode = 'mouse';
        let currentColor = '#ff6b6b';
        let brushSize = 20;
        let history = [];
        let historyIndex = -1;
        let currentStamp = '⭐';
        let lastX = 0;
        let lastY = 0;
        
        // Gesture state
        let hands = null;
        let camera = null;
        let prevGesture = null;
        
        // Initialize history
        saveState();
        
        // Mouse Mode
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);
        
        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            lastX = touch.clientX - rect.left;
            lastY = touch.clientY - rect.top;
            isDrawing = true;
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!isDrawing) return;
            const touch = e.touches[0];
            drawAt(touch.clientX, touch.clientY);
        });
        
        canvas.addEventListener('touchend', stopDrawing);
        
        function startDrawing(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = e.clientX - rect.left;
            lastY = e.clientY - rect.top;
        }
        
        function draw(e) {
            if (!isDrawing) return;
            drawAt(e.clientX, e.clientY);
        }
        
        function drawAt(x, y) {
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
            lastX = x;
            lastY = y;
        }
        
        function stopDrawing() {
            if (isDrawing) {
                isDrawing = false;
                saveState();
            }
        }
        
        // Mode Switching
        async function setMode(mode) {
            if (mode === 'gesture') {
                // Show loading
                document.getElementById('loadingOverlay').classList.remove('hidden');
                
                try {
                    await startGestureDetection();
                    currentMode = 'gesture';
                    document.getElementById('loadingOverlay').classList.add('hidden');
                } catch (error) {
                    document.getElementById('loadingOverlay').classList.add('hidden');
                    showError(error.message);
                    return;
                }
            } else {
                stopGestureDetection();
                currentMode = 'mouse';
            }
            
            document.getElementById('mouseModeBtn').classList.toggle('active', mode === 'mouse');
            document.getElementById('gestureModeBtn').classList.toggle('active', mode === 'gesture');
            
            if (mode === 'gesture') {
                document.getElementById('gestureHelp').classList.remove('hidden');
                document.getElementById('modeIndicator').classList.remove('hidden');
                document.getElementById('gestureCanvas').style.display = 'block';
            } else {
                document.getElementById('gestureHelp').classList.add('hidden');
                document.getElementById('modeIndicator').classList.add('hidden');
                document.getElementById('gestureCanvas').style.display = 'none';
            }
        }
        
        // Colors
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('ring-4', 'ring-yellow-400'));
                btn.classList.add('ring-4', 'ring-yellow-400');
                currentColor = btn.dataset.color;
            });
        });
        
        // Brush Size
        document.getElementById('brushSize').addEventListener('input', (e) => {
            brushSize = e.target.value;
            document.getElementById('brushSizeLabel').textContent = brushSize;
        });
        
        // History
        function saveState() {
            historyIndex++;
            history = history.slice(0, historyIndex);
            history.push(canvas.toDataURL());
        }
        
        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                loadState(history[historyIndex]);
            }
        }
        
        function loadState(dataUrl) {
            const img = new Image();
            img.onload = () => {
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
            };
            img.src = dataUrl;
        }
        
        function clearCanvas() {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            saveState();
            showGesture('🗑️');
        }
        
        function saveCanvas() {
            const link = document.createElement('a');
            link.download = '我的画作-' + Date.now() + '.png';
            link.href = canvas.toDataURL();
            link.click();
            showGesture('💾');
        }
        
        function togglePanel() {
            document.getElementById('controlPanel').classList.toggle('hidden');
        }
        
        // Sticker functions
        function setStamp(stamp) {
            currentStamp = stamp;
            closeStickerBar();
            
            // Draw stamp in center
            ctx.font = '100px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(stamp, canvas.width/2, canvas.height/2);
            saveState();
            showGesture(stamp);
        }
        
        function closeStickerBar() {
            document.getElementById('stickerBar').classList.add('hidden');
        }
        
        function showGesture(emoji) {
            const indicator = document.getElementById('gestureIndicator');
            indicator.textContent = emoji;
            indicator.classList.add('show');
            setTimeout(() => {
                indicator.classList.remove('show');
            }, 1000);
        }
        
        // Error handling
        function showError(message) {
            document.getElementById('errorText').textContent = message;
            document.getElementById('errorMessage').classList.remove('hidden');
        }
        
        function retryCamera() {
            document.getElementById('errorMessage').classList.add('hidden');
            setMode('gesture');
        }
        
        function useMouseMode() {
            document.getElementById('errorMessage').classList.add('hidden');
            setMode('mouse');
        }
        
        // Gesture Detection using MediaPipe Hands
        async function startGestureDetection() {
            return new Promise((resolve, reject) => {
                try {
                    // Check if Hands is available
                    if (typeof Hands === 'undefined') {
                        throw new Error('手势识别库加载失败，请刷新页面重试');
                    }
                    
                    hands = new Hands({
                        locateFile: (file) => {
                            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`;
                        }
                    });
                    
                    hands.setOptions({
                        maxNumHands: 1,
                        modelComplexity: 1,
                        minDetectionConfidence: 0.5,
                        minTrackingConfidence: 0.5
                    });
                    
                    hands.onResults(onGestureResults);
                    
                    // Check if Camera is available
                    if (typeof Camera === 'undefined') {
                        throw new Error('摄像头库加载失败，请刷新页面重试');
                    }
                    
                    camera = new Camera(document.getElementById('videoElement'), {
                        onFrame: async () => {
                            await hands.send({ image: document.getElementById('videoElement') });
                        },
                        width: 640,
                        height: 480
                    });
                    
                    camera.start().then(() => {
                        resolve();
                    }).catch(error => {
                        reject(new Error('无法访问摄像头，请确保已授予摄像头权限'));
                    });
                } catch (error) {
                    reject(error);
                }
            });
        }
        
        function stopGestureDetection() {
            if (camera) {
                camera.stop();
                camera = null;
            }
            hands = null;
        }
        
        function onGestureResults(results) {
            gestureCtx.clearRect(0, 0, gestureCanvas.width, gestureCanvas.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // Draw hand
                gestureCtx.strokeStyle = '#ff6b6b';
                gestureCtx.lineWidth = 2;
                gestureCtx.fillStyle = 'rgba(255,107,107,0.3)';
                
                // Draw connections
                const connections = [
                    [0, 1], [1, 2], [2, 3], [3, 4],
                    [0, 5], [5, 6], [6, 7], [7, 8],
                    [0, 9], [9, 10], [10, 11], [11, 12],
                    [0, 13], [13, 14], [14, 15], [15, 16],
                    [0, 17], [17, 18], [18, 19], [19, 20],
                    [5, 9], [9, 13], [13, 17]
                ];
                
                connections.forEach(([i, j]) => {
                    gestureCtx.beginPath();
                    gestureCtx.moveTo(landmarks[i].x * gestureCanvas.width, landmarks[i].y * gestureCanvas.height);
                    gestureCtx.lineTo(landmarks[j].x * gestureCanvas.width, landmarks[j].y * gestureCanvas.height);
                    gestureCtx.stroke();
                });
                
                // Draw landmarks
                landmarks.forEach(landmark => {
                    gestureCtx.beginPath();
                    gestureCtx.arc(landmark.x * gestureCanvas.width, landmark.y * gestureCanvas.height, 5, 0, 2 * Math.PI);
                    gestureCtx.fill();
                });
                
                // Detect gesture
                const gesture = detectGesture(landmarks);
                if (gesture !== prevGesture) {
                    prevGesture = gesture;
                    handleGesture(gesture, landmarks);
                }
            }
        }
        
        function detectGesture(landmarks) {
            const tips = [4, 8, 12, 16, 20]; // Thumb, Index, Middle, Ring, Pinky
            const pip = [3, 6, 10, 14, 18]; // PIP joints
            
            const fingers = tips.map((tip, i) => {
                return landmarks[tip].y < landmarks[pip[i]].y;
            });
            
            // Index finger pointing (peace sign for drawing)
            const isPeace = fingers[1] && fingers[2] && !fingers[0] && !fingers[3] && !fingers[4];
            
            // Fist
            const isFist = !fingers.some(f => f);
            
            // Thumbs up
            const isThumbsUp = !fingers[1] && !fingers[2] && !fingers[3] && !fingers[4] && 
                              landmarks[4].y < landmarks[3].y;
            
            // Open palm
            const isOpen = fingers.every(f => f);
            
            // OK gesture
            const isOK = landmarks[4].y > landmarks[8].y && 
                        Math.abs(landmarks[4].x - landmarks[8].x) < 0.1;
            
            if (isPeace) return 'peace';
            if (isFist) return 'fist';
            if (isThumbsUp) return 'thumbsup';
            if (isOpen) return 'open';
            if (isOK) return 'ok';
            
            return 'none';
        }
        
        function handleGesture(gesture, landmarks) {
            switch(gesture) {
                case 'peace':
                    isDrawing = true;
                    const indexTip = landmarks[8];
                    lastX = indexTip.x * canvas.width;
                    lastY = indexTip.y * canvas.height;
                    showGesture('✌️');
                    break;
                    
                case 'fist':
                    isDrawing = false;
                    showGesture('✊');
                    if (historyIndex < history.length - 1) {
                        historyIndex++;
                        loadState(history[historyIndex]);
                    }
                    break;
                    
                case 'thumbsup':
                    showGesture('👍');
                    // Change color randomly
                    const colors = ['#ff6b6b', '#ffa502', '#ffd93d', '#6bcb77', '#4d96ff', '#9b59b6'];
                    currentColor = colors[Math.floor(Math.random() * colors.length)];
                    document.querySelectorAll('.color-btn').forEach(btn => {
                        btn.classList.toggle('ring-4', btn.dataset.color === currentColor);
                    });
                    break;
                    
                case 'open':
                    showGesture('✋');
                    clearCanvas();
                    break;
                    
                case 'ok':
                    showGesture('🤟');
                    document.getElementById('stickerBar').classList.remove('hidden');
                    break;
            }
        }
        
        // Draw continuously while peace sign is detected
        setInterval(() => {
            if (currentMode === 'gesture' && isDrawing && prevGesture === 'peace') {
                const indexTip = document.querySelector('#gestureCanvas')?.__prevLandmarks?.[8];
                if (indexTip) {
                    drawAt(indexTip.x * canvas.width, indexTip.y * canvas.height);
                }
            }
        }, 50);
    </script>
</body>
</html>
